services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
